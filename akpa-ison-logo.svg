<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#020c2b"/>
  
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020c2b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1429;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1dd1a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4aa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with gradient -->
  <rect width="200" height="200" fill="url(#bgGradient)"/>
  
  <!-- Outer frame with glassmorphism effect -->
  <rect x="20" y="20" width="160" height="160" rx="16" fill="rgba(15, 20, 41, 0.8)" stroke="url(#accentGradient)" stroke-width="2" opacity="0.8"/>
  
  <!-- Inner glow -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="rgba(29, 209, 161, 0.15)" stroke-width="1"/>
  
  <!-- Envelope Icon Base -->
  <g transform="translate(100, 100)">
    <!-- Envelope body -->
    <rect x="-40" y="-30" width="80" height="60" rx="4" fill="none" stroke="url(#accentGradient)" stroke-width="2.5"/>
    
    <!-- Envelope flap -->
    <path d="M -40 -30 L 0 0 L 40 -30" fill="none" stroke="url(#accentGradient)" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Email arrow (send indicator) -->
    <path d="M -5 5 L 15 -5 L 5 10" fill="none" stroke="url(#accentGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Letter lines (content indicator) -->
    <line x1="-30" y1="5" x2="20" y2="5" stroke="rgba(29, 209, 161, 0.6)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-30" y1="12" x2="30" y2="12" stroke="rgba(29, 209, 161, 0.4)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-30" y1="19" x2="25" y2="19" stroke="rgba(29, 209, 161, 0.3)" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- Top accent line -->
  <line x1="40" y1="30" x2="160" y2="30" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Bottom accent line -->
  <line x1="40" y1="170" x2="160" y2="170" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Corner dots for tech feel -->
  <circle cx="25" cy="25" r="2.5" fill="url(#accentGradient)"/>
  <circle cx="175" cy="25" r="2.5" fill="url(#accentGradient)"/>
  <circle cx="25" cy="175" r="2.5" fill="url(#accentGradient)"/>
  <circle cx="175" cy="175" r="2.5" fill="url(#accentGradient)"/>
</svg>
